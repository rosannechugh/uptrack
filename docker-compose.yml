
services:
  db:
    image: postgres:16
    container_name: uptrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptrack
      POSTGRES_USER: uptrack
      POSTGRES_PASSWORD: uptrack_dev
    ports:
      - "5433:5432"
    volumes:
      - uptrack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptrack -d uptrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: uptrack-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://uptrack:uptrack_dev@db:5432/uptrack
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: uptrack-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uptrack_data:
